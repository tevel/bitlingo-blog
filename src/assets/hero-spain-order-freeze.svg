<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="spain-title spain-desc">
  <title id="spain-title">Audio drill for ordering in Spanish before Madrid or Barcelona</title>
  <desc id="spain-desc">Café table in Spain with earbuds, an audio waveform, and the waiter reply ¿Para tomar aquí o para llevar? beside a traveler who needs the next Spanish line</desc>
  <defs>
    <linearGradient id="so-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a365d"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#f6ad55"/>
    </linearGradient>
    <linearGradient id="so-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="so-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1a202c" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#so-sky)"/>
  <g fill="#1c1917" opacity="0.35">
    <rect x="70" y="250" width="70" height="280"/>
    <rect x="160" y="190" width="90" height="340"/>
    <rect x="270" y="230" width="60" height="300"/>
    <rect x="900" y="210" width="80" height="320"/>
    <rect x="1000" y="160" width="110" height="370"/>
  </g>
  <rect x="0" y="500" width="1200" height="130" fill="#7c2d12" opacity="0.45"/>
  <g filter="url(#so-shadow)">
    <rect x="300" y="150" width="600" height="300" rx="28" fill="url(#so-card)"/>
  </g>
  <text x="340" y="220" fill="#9a3412" font-family="Georgia, serif" font-size="28" font-weight="700">You will hear</text>
  <text x="340" y="290" fill="#1c1917" font-family="Georgia, serif" font-size="36">¿Para tomar aquí</text>
  <text x="340" y="345" fill="#1c1917" font-family="Georgia, serif" font-size="36">o para llevar?</text>
  <text x="340" y="410" fill="#c2410c" font-family="Georgia, serif" font-size="26">Para tomar aquí.</text>
  <g fill="#4361ee">
    <rect x="860" y="250" width="14" height="40" rx="4"/>
    <rect x="882" y="230" width="14" height="80" rx="4"/>
    <rect x="904" y="210" width="14" height="120" rx="4"/>
    <rect x="926" y="235" width="14" height="70" rx="4"/>
  </g>
  <circle cx="180" cy="430" r="36" fill="#fff" opacity="0.9"/>
  <circle cx="250" cy="455" r="22" fill="#fff" opacity="0.75"/>
  <text x="80" y="90" fill="#fff" font-family="Georgia, serif" font-size="42" font-weight="700">Madrid · Barcelona</text>
  <text x="80" y="140" fill="#ffedd5" font-family="Georgia, serif" font-size="24">Say the reply before you land</text>
</svg>
